name: 构建单文件产物

# 触发时机：
#   1. 发布新 Release 时 —— 自动重新生成单文件并附到 Release 上
#   2. 手动触发（workflow_dispatch）—— 改完源码后可手动重建
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      commit_changes:
        description: "是否把重新生成的 ugreen_ai_reply.py 提交回仓库"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: 重新生成单文件
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 发版时以 tag 对应的提交为准；手动触发时用当前分支
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
          # 完整历史：提交回 main 时需要基于远端最新 main 重建提交，
          # 否则浅克隆下 push 会退化成 force 覆盖，丢掉别人的提交
          fetch-depth: 0

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 重新生成单文件产物
        run: |
          python tools/build_single.py
          cp ugreen_ai_reply.py "$RUNNER_TEMP/ugreen_ai_reply.py"

      - name: 运行测试
        run: python -m unittest discover -s tests -v

      - name: 校验产物与源码一致
        run: python tools/build_single.py --check

      - name: 提交变更到 main
        if: github.event_name == 'workflow_dispatch' && inputs.commit_changes
        run: |
          if git diff --quiet -- ugreen_ai_reply.py; then
            echo "单文件已是最新，无需提交"
            exit 0
          fi
          # 必须基于远端最新 main 重建提交：
          # 若本地 HEAD 已落后于远端，直接 push 会失败或覆盖别人的提交。
          git fetch origin main
          git checkout -B rebuild origin/main
          # 把重新生成的产物带过去
          cp "$RUNNER_TEMP/ugreen_ai_reply.py" ugreen_ai_reply.py
          git add ugreen_ai_reply.py
          git diff --cached --quiet && { echo "远端已有相同产物，跳过"; exit 0; }
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: 重新生成单文件产物"
          # --force-with-lease：远端被别人改过就拒绝，而不是覆盖
          git push --force-with-lease origin HEAD:main

      - name: 上传产物到 Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            ugreen_ai_reply.py \
            --clobber \
            "# 单文件产物（青龙直接用这个）"
