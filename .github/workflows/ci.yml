name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: 测试 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 校验单文件产物与源码一致
        run: |
          python tools/build_single.py --check

      - name: 运行测试
        run: python -m unittest discover -s tests -v

      - name: 校验包可正常导入
        run: |
          python -c "import ugreen; print('ugreen', ugreen.__version__)"
        env:
          PYTHONPATH: src
